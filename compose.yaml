services:
  example:
    image: microfe-example:local
    build:
      context: .
      target: example
    ports:
      - '3001:8080'
  shell:
    image: microfe-shell:local
    build:
      context: .
      target: shell
    environment:
      MICROFE_ENV: ${MICROFE_ENV:-development}
      MICROFE_EXAMPLE_URL: ${MICROFE_EXAMPLE_URL:-http://localhost:3001/remoteEntry.js}
    ports:
      - '3000:8080'
    depends_on:
      example:
        condition: service_healthy
